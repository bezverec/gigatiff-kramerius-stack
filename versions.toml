[stack]
name = "GigaTIFF Kramerius Stack"
repository = "https://github.com/bezverec/gigatiff-kramerius-stack"
version = "stack-0.1.15"
runtime_directory = "gigatiff-kramerius"

[ghcr]
namespace = "ghcr.io/bezverec"
web_client_image = "gigatiff-kramerius-web-client"
auth_shim_image = "gigatiff-kramerius-auth-shim"
admin_client_image = "gigatiff-kramerius-admin-client"
bootstrap_image = "gigatiff-kramerius-bootstrap"
gigatiff_server_image = "gigatiff-server"

[core]
kramerius_api_version = "7.2.2.1"
kramerius_api_image = "ceskaexpedice/kramerius:7.2.2.1"
kramerius_web_client_version = "3.0.29"
kramerius_web_client_base_image = "trinera/cdk-client:3.0.29"
kramerius_admin_client_repository = "https://github.com/ceskaexpedice/kramerius-admin-client"
kramerius_admin_client_ref = "cb16f71247d34780604fcc867eb9a884279e48c6"
gigatiff_server_version = "0.3.4"
gigatiff_repository = "https://github.com/bezverec/gigatiff"
gigatiff_ref = "6cd4573271f93273ef1ee837e9418f53e4678e0b"

[services]
curator_worker = "ceskaexpedice/curator-worker:7.2.2.1"
public_worker = "ceskaexpedice/public-worker:7.2.2.1"
process_manager = "ceskaexpedice/process-manager:1.5.2"
solr = "solr:10.0.0"
postgresql = "postgres:18.6"
keycloak_postgresql = "postgres:14.24"
keycloak = "ceskaexpedice/keycloak_eduid:22.0.11-1.10"
dragonfly = "docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2"
